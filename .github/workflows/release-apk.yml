name: Build & Publish Zero Play APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as Preview (pre-release) build'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare debug keystore & env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Zero Play APK
        run: gradle assembleDebug --no-daemon

      - name: Read Version Metadata
        id: meta
        run: |
          VNAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VCODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]//g')
          TAG="v${VNAME}.${VCODE}"
          echo "version_name=$VNAME" >> $GITHUB_OUTPUT
          echo "version_code=$VCODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Zero Play ${{ steps.meta.outputs.tag }}
          body: |
            Automated Zero Play APK release for [`nilimadas567345-sudo/Zero-play-`](https://github.com/nilimadas567345-sudo/Zero-play-).
            - Version: `${{ steps.meta.outputs.version_name }}` (`${{ steps.meta.outputs.version_code }}`)
            - Install directly or update inside **Zero Play → Settings → Auto update**.
          prerelease: ${{ inputs.prerelease == true }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
